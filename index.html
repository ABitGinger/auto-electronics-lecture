<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080c12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>汽车电子控制技术 · 精讲课</title>
<meta name="description" content="面向零基础的汽车电子控制技术精讲课：13 讲配音讲解、课中 QTE、课末接题库原题、暂停可复制、期末 35 题全量考核。" />

<!-- 关键 CSS 内联：保证打开第一帧就是深色加载页，不会白屏 -->
<style>
  html,body{margin:0;height:100%;background:#080c12;color:#e8eff9;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  #boot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(760px 520px at 50% 22%,rgba(34,211,238,.12),transparent 66%),#070b11}
  .boot-in{width:min(720px,92vw);box-sizing:border-box}
  .boot-eyebrow{font-size:11.5px;letter-spacing:.34em;color:#22d3ee;text-transform:uppercase;
    font-family:ui-monospace,Consolas,monospace}
  #boot h1{margin:10px 0 6px;font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.02em;
    background:linear-gradient(96deg,#fff 12%,#9fe8f5 46%,#8ab4ff 82%);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .boot-sub{margin:0 0 20px;color:#b9c7da;font-size:14px}
  .boot-list{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
  .boot-list li{position:relative;padding-left:18px;color:#b9c7da;font-size:13.5px;line-height:1.7}
  .boot-list b{color:#e8eff9}
  .boot-list li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;
    background:#22d3ee}
  .bigbtn{border:0;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;color:#04121b;
    padding:14px 28px;border-radius:12px;background:linear-gradient(100deg,#7ff0ff,#22d3ee 55%,#38bdf8);
    box-shadow:0 14px 40px -12px rgba(34,211,238,.75);transition:opacity .2s,transform .16s}
  .bigbtn[disabled]{background:#1b2735;color:#8ea3bd;cursor:progress;box-shadow:none}
  .loadwrap{margin-top:16px;max-width:420px}
  .loadbar{height:4px;border-radius:99px;background:#141c27;overflow:hidden}
  .loadbar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#38bdf8,#22d3ee);transition:width .35s ease}
  .loadtxt{margin-top:9px;font-size:12px;color:#7e8fa6;line-height:1.6;min-height:2.4em}
  .loadtxt .spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(34,211,238,.25);
    border-top-color:#22d3ee;display:inline-block;vertical-align:-1px;margin-right:7px;animation:bsp .8s linear infinite}
  .loadtxt.slow{color:#fbbf24}
  .loadtxt.err{color:#f87171}
  .loadtxt a{color:#22d3ee;text-decoration:underline;cursor:pointer}
  @keyframes bsp{to{transform:rotate(360deg)}}
  .boot-tip{margin:12px 0 0;font-size:12px;color:#5c6b80}
  .boot-tip b{color:#b9c7da}
  @media(max-width:520px){
    .boot-list{display:none}
    .bigbtn{width:100%}
    #boot h1{font-size:42px}
  }
</style>

<!-- 主样式异步加载：不阻塞首帧（内联关键样式已覆盖加载页） -->
<link rel="stylesheet" href="assets/css/lecture.css?v=20261028d" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="assets/css/lecture.css?v=20261028d" /></noscript>

<body>

<!-- ============ 启动页（先于一切脚本可见） ============ -->
<div class="boot" id="boot">
  <div class="boot-in">
    <div class="boot-eyebrow">汽车电子控制技术</div>
    <h1>精讲课</h1>
    <p class="boot-sub">13 讲 · 全程配音 · 零基础从头讲起</p>
    <ul class="boot-list">
      <li><b>先讲知识，再碰题目</b>　每一讲把概念讲透，课末才把题库原题拿出来示范怎么答</li>
      <li><b>课中 QTE</b>　讲到关键处会停下来问你一句，8 秒内作答，答错也继续讲</li>
      <li><b>随时暂停</b>　空格暂停，倒计时一起冻结；暂停页可一键复制整讲文本去问 AI</li>
    </ul>
    <button class="bigbtn" id="bootGo" disabled>正在装载…</button>
    <div class="loadwrap" id="loadWrap">
      <div class="loadbar"><i id="ldBar"></i></div>
      <div class="loadtxt" id="ldTxt"><span class="spin"></span>正在连接课程数据…</div>
    </div>
    <p class="boot-tip" id="bootTip" hidden>共 <b id="bootMin">—</b> 分钟 · <b id="bootSeg">—</b> 个讲解段落</p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div class="app" id="app" hidden>

  <header class="bar">
    <button class="ib" id="btnSide" title="课程目录（M）">☰</button>
    <div class="bar-title">
      <span class="chip" id="chChip">第一讲</span>
      <b id="barTitle">汽车电子系统的骨架</b>
    </div>
    <div class="bar-right">
      <span class="mono dim" id="barCount">1 / 6</span>
      <button class="ib" id="btnMute" title="静音（N）">🔊</button>
      <button class="ib" id="btnSpeed" title="语速（P）">1.0×</button>
      <button class="ib" id="btnSheet" title="本讲讲义（S）"><span class="ic">📄</span><span class="lbl">讲义</span></button>
      <a class="ib" href="#/exam" title="期末全量考核"><span class="ic">🎯</span><span class="lbl">期末</span></a>
    </div>
  </header>

  <!-- 连续时间轴：整门课一条，可拖动 -->
  <div class="tl" id="tl">
    <div class="tl-track" id="tlTrack">
      <div class="tl-marks" id="tlMarks"></div>
      <div class="tl-fill" id="tlFill"></div>
      <div class="tl-knob" id="tlKnob"></div>
      <div class="tl-tip" id="tlTip"></div>
    </div>
  </div>

  <div class="buffer" id="buffer" hidden><i></i><span id="bufferTxt">缓冲中…</span></div>

  <main class="arena">
    <aside class="side" id="side"></aside>
    <section class="deck" id="deck"></section>
  </main>

  <footer class="ctrl">
    <div class="ctrl-l">
      <button class="cb" id="btnPrev" title="上一段（←）">‹</button>
      <button class="cb main" id="btnPlay" title="播放 / 暂停（空格）">❚❚</button>
      <button class="cb" id="btnNext" title="下一段（→）">›</button>
    </div>
    <div class="ctrl-m">
      <span class="mono" id="tNow">00:00</span>
      <span class="ctrl-meta" id="tMeta">—</span>
      <span class="mono dim" id="tAll">00:00</span>
    </div>
    <div class="ctrl-r">
      <button class="cb" id="btnCopy" title="复制本讲为文本（C）"><span class="ic">⧉</span><span class="lbl">复制本讲</span></button>
      <button class="cb" id="btnExam2" title="期末全量考核"><span class="ic">🎯</span><span class="lbl">期末</span></button>
    </div>
  </footer>
</div>

<!-- ============ 暂停 ============ -->
<div class="pause" id="pause" hidden>
  <div class="pause-card">
    <div class="eyebrow">PAUSED</div>
    <h2>已暂停</h2>
    <p class="pause-sub">配音与倒计时已冻结，可以慢慢读这一页。</p>
    <div class="pause-acts">
      <button class="btn primary" id="pResume">继续播放</button>
      <button class="btn" id="pCopy">⧉ 复制本讲</button>
      <button class="btn ghost" id="pSheet">看讲义</button>
    </div>
  </div>
</div>

<!-- ============ 讲义 ============ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-hd"><b id="sheetTitle">讲义</b><div><button class="btn sm" id="sheetCopy">复制</button><button class="ib" id="sheetX">✕</button></div></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- ============ 目录 ============ -->
<div class="menu" id="menu" hidden>
  <div class="menu-card">
    <div class="sheet-hd"><b>课程目录 · 13 讲</b><button class="ib" id="menuX">✕</button></div>
    <div class="menu-body" id="menuBody"></div>
  </div>
</div>

<!-- ============ 复制结果 ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="sheet-hd"><b id="modalT">复制文本</b><button class="ib" id="modalX">✕</button></div>
    <textarea id="modalText" readonly></textarea>
    <div class="row-end"><span class="copied" id="copied">已复制 ✓</span><button class="btn primary" id="modalCopy">复制到剪贴板</button></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<canvas class="fx" id="fx"></canvas>

<script>
/* ---------- 装载进度：每个资源到位就推进一格 ---------- */
window.TK = { bank: [], figs: {}, course: [], timing: {}, examObj: {} };
(function () {
  var TOTAL = 11, done = 0, failed = [], ready = false, t0 = Date.now(), timer;
  var bar = document.getElementById('ldBar'), txt = document.getElementById('ldTxt');
  function paint(msg, cls) {
    if (bar) bar.style.width = Math.min(100, Math.round(done / TOTAL * 100)) + '%';
    if (txt && msg) {
      txt.className = 'loadtxt' + (cls ? ' ' + cls : '');
      txt.innerHTML = msg;
    }
  }
  window.__ld = function (name, ok) {
    if (ready) return;
    done++;
    if (ok === false) {
      failed.push(name);
      paint('「' + name + '」加载失败　<a onclick="location.reload()">点击重试</a>', 'err');
      return;
    }
    if (failed.length) return;
    paint('<span class="spin"></span>正在装载 ' + name + ' … ' + done + ' / ' + TOTAL);
  };
  window.__ldDone = function () {
    if (ready) return;
    ready = true;
    clearInterval(timer);
    done = TOTAL;
    paint('<span class="spin"></span>准备就绪');
    var w = document.getElementById('loadWrap');
    if (w) { w.style.transition = 'opacity .3s'; w.style.opacity = 0; setTimeout(function () { w.style.display = 'none'; }, 320); }
  };
  if (bar) bar.style.width = '4%';
  /* 弱网提示：超过 5 秒还没装完，换一句话安抚 */
  timer = setInterval(function () {
    if (done >= TOTAL || failed.length || !txt) return;
    var s = Math.round((Date.now() - t0) / 1000);
    if (s >= 5) {
      txt.className = 'loadtxt slow';
      txt.innerHTML = '<span class="spin"></span>网络较慢，已等待 ' + s + ' 秒，正在继续装载（' + done + ' / ' + TOTAL + '）';
    }
  }, 1000);
})();
</script>
